# Copy to /etc/apache2/sites-available/sajawat.conf
# Replace erp.example.com with your domain, then:
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo a2dissite 000-default.conf
#   sudo a2ensite sajawat.conf
#   sudo systemctl reload apache2
#   sudo certbot --apache -d erp.example.com
#
# Certbot will add the HTTPS virtual host. Login cookies are Secure in
# production, so the site must be served over HTTPS.

<VirtualHost *:80>
    ServerName erp.example.com

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    ProxyPass / http://127.0.0.1:3000/ timeout=300
    ProxyPassReverse / http://127.0.0.1:3000/

    LimitRequestBody 10485760

    ErrorLog ${APACHE_LOG_DIR}/sajawat-error.log
    CustomLog ${APACHE_LOG_DIR}/sajawat-access.log combined
</VirtualHost>
